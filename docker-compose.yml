services:
  postgres:
    image: postgres:16-alpine
    container_name: projectops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: projectops
      POSTGRES_PASSWORD: projectops_secret
      POSTGRES_DB: projectops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectops -d projectops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
